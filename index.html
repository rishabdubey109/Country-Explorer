<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="converter">

        <h1>Currency Converter</h1>
        <p class="subtitle">Convert currencies using live exchange rates</p>

        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount">
        </div>

        <div class="currency-row">

            <div class="form-group">
                <label for="fromCurrency">From</label>

                <select id="fromCurrency">
                    <option value="USD">USD - US Dollar</option>
                    <option value="INR">INR - Indian Rupee</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="JPY">JPY - Japanese Yen</option>
                    <option value="AUD">AUD - Australian Dollar</option>
                    <option value="CAD">CAD - Canadian Dollar</option>
                </select>
            </div>

            <button id="swapBtn" class="swap-btn" title="Swap currencies">
                ⇄
            </button>

            <div class="form-group">
                <label for="toCurrency">To</label>

                <select id="toCurrency">
                    <option value="INR">INR - Indian Rupee</option>
                    <option value="USD">USD - US Dollar</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="JPY">JPY - Japanese Yen</option>
                    <option value="AUD">AUD - Australian Dollar</option>
                    <option value="CAD">CAD - Canadian Dollar</option>
                </select>
            </div>

        </div>

        <button id="convertBtn" class="convert-btn">
            Convert
        </button>

        <div id="result" class="result">
            Enter an amount and click Convert
        </div>

        <p id="rate" class="rate"></p>

        <p id="error" class="error"></p>

        <div class="footer-text">
            Exchange rates are fetched from an online API.
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
